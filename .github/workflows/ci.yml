name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  design:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN_VERSION: 0.0.0-0.nightly.2026.07.27
    steps:
      - uses: actions/checkout@v4

      - name: Cache Carbon toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: carbon_toolchain-0.0.0-0.nightly.2026.07.27
          key: carbon-toolchain-${{ env.TOOLCHAIN_VERSION }}-linux-x86_64

      - name: Download pinned Carbon nightly toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o toolchain.tar.gz \
            "https://github.com/carbon-language/carbon-lang/releases/download/v${TOOLCHAIN_VERSION}/carbon_toolchain-${TOOLCHAIN_VERSION}.tar.gz"
          tar xzf toolchain.tar.gz

      - name: Build
        run: ./build.sh

      - name: Design run + QA gate + golden diff
        run: ./test.sh
